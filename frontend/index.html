<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fit & Fuel AI Coach - local real-time exercise form analysis with MediaPipe." />
    <title>Fit & Fuel AI Coach - Train Smarter. Move Better.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #0a0a0f;
        color: #f9fafb;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .boot-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(59, 130, 246, 0.16), transparent 58%),
          #0a0a0f;
      }

      .boot-fallback__panel {
        width: min(460px, 100%);
        padding: 24px;
        border: 1px solid #1f2937;
        border-radius: 14px;
        background: #111827;
        text-align: center;
      }

      .boot-fallback__spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 16px;
        border: 2px solid #3b82f6;
        border-top-color: transparent;
        border-radius: 999px;
        animation: boot-spin 1s linear infinite;
      }

      .boot-fallback__title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 800;
      }

      .boot-fallback__text {
        margin: 0;
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.6;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div class="boot-fallback__panel">
          <div class="boot-fallback__spinner" aria-hidden="true"></div>
          <h1 class="boot-fallback__title">Loading Fit & Fuel AI Coach</h1>
          <p class="boot-fallback__text">
            If this stays here, run the Vite dev server and open http://localhost:5173.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
