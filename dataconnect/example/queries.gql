query ListExercises @auth(level: USER) {
  exercises {
    name
    muscleGroup
    difficultyLevel
  }
}

mutation CreateSession($exerciseId: UUID!, $duration: Int!) @auth(level: USER) {
  session_insert(data: {
    exerciseId: $exerciseId,
    userId_expr: "auth.uid",
    timestamp_time: {now: true},
    duration: $duration
  })
}

mutation RecordAttempt($sessionId: UUID!, $formScore: Int!, $comments: String!) @auth(level: USER) {
  attempt_insert(data: {
    sessionId: $sessionId,
    formScore: $formScore,
    feedbackComments: $comments
  })
}

query GetUserSessions @auth(level: USER) {
  sessions(where: {userId: {eq_expr: "auth.uid"}}, orderBy: [{timestamp: DESC}]) {
    timestamp
    duration
    totalScore
    exercise {
      name
    }
  }
}