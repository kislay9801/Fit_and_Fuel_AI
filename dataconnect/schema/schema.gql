type User @table {
  email: String!
  displayName: String!
  fitnessGoal: String
  joinedAt: Timestamp
}

type Exercise @table {
  name: String!
  muscleGroup: String!
  description: String!
  difficultyLevel: String
  videoDemoUrl: String
}

type Session @table {
  user: User!
  exercise: Exercise!
  timestamp: Timestamp!
  duration: Int
  totalScore: Float
}

type Attempt @table {
  session: Session!
  formScore: Int!
  feedbackComments: String!
  videoUrl: String
  frameAnalysisData: String # Stored as JSON blob
}

type FeedbackItem @table {
  attempt: Attempt!
  label: String!
  severity: String!
  timestampInVideo: Float
}